<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة مهامي الأسبوعية</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#e8f5e9,#e3f2fd);
    color:#263238;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.icon{
    font-size:.8em;
}

/* العنوان */

header{
    background:linear-gradient(135deg,#1976d2,#2e7d32);
    color:white;
    padding:25px 15px;
    border-radius:20px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
}

header h1{
    margin:0 0 8px;
    font-size:28px;
}

header p{
    margin:0;
    font-size:16px;
}

/* الإحصائيات */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:white;
    padding:15px 8px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.stat strong{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.stat span{
    font-size:14px;
    font-weight:bold;
}

/* التقدم */

.progress-box{
    background:white;
    padding:16px;
    border-radius:16px;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.progress-title{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
}

.progress{
    height:13px;
    background:#e0e0e0;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:#2e7d32;
    transition:.3s;
}

/* إضافة مهمة */

.add-box{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.add-box h2{
    margin-top:0;
    font-size:21px;
}

input,
select{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:17px;
    background:#fafafa;
}

button{
    border:none;
    border-radius:11px;
    padding:12px 16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn{
    width:100%;
    background:#2e7d32;
    color:white;
}

/* البحث */

.search-box{
    background:white;
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.search-row{
    display:flex;
    gap:8px;
    align-items:center;
}

.search-row input{
    flex:1;
    margin:0;
}

.search-btn{
    background:#1976d2;
    color:white;
    white-space:nowrap;
}

/* الفلاتر */

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:18px;
}

.filter-btn{
    background:white;
    color:#37474f;
    border:1px solid #ddd;
}

.filter-btn.active{
    background:#1976d2;
    color:white;
}

/* العنوان */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-title h2{
    margin:0;
    font-size:22px;
}

.delete-all{
    background:#d32f2f;
    color:white;
}

/* المهام */

.task-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.task{
    background:white;
    padding:17px;
    border-radius:17px;
    border-right:6px solid #1976d2;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.task.completed{
    border-right-color:#43a047;
    opacity:.82;
}

.task.overdue{
    border-right-color:#d32f2f;
}

.task-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
    word-break:break-word;
}

.task.completed .task-title{
    text-decoration:line-through;
}

.task-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
}

.badge{
    padding:7px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.date-badge{
    background:#e3f2fd;
    color:#1565c0;
}

.high{
    background:#ffebee;
    color:#c62828;
}

.medium{
    background:#fff8e1;
    color:#ef6c00;
}

.low{
    background:#e8f5e9;
    color:#2e7d32;
}

.status{
    background:#f5f5f5;
    color:#455a64;
}

.task-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.complete-btn{
    background:#43a047;
    color:white;
}

.edit-btn{
    background:#1976d2;
    color:white;
}

.delete-btn{
    background:#d32f2f;
    color:white;
}

/* لا توجد مهام */

.empty{
    background:white;
    padding:30px 15px;
    border-radius:17px;
    text-align:center;
    color:#607d8b;
    font-size:17px;
    box-shadow:0 4px 12px rgba(0,0,0,.07);
}

/* لوحة اليوم والأسبوع */

.dashboard-title{
    font-size:21px;
    margin:18px 0 10px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

.dashboard-card{
    background:white;
    padding:15px 8px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    cursor:pointer;
}

.dashboard-icon{
    font-size:18px;
}

.dashboard-number{
    font-size:24px;
    font-weight:bold;
    margin:5px 0;
}

.dashboard-label{
    font-size:13px;
    font-weight:bold;
}

/* نافذة التعديل */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal-box{
    width:100%;
    max-width:500px;
    background:white;
    padding:20px;
    border-radius:20px;
}

.modal-box h2{
    margin-top:0;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.save-btn{
    flex:1;
    background:#1976d2;
    color:white;
}

.cancel-btn{
    flex:1;
    background:#eeeeee;
}

/* الهاتف */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    header h1{
        font-size:24px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .search-row{
        gap:6px;
    }

    .search-btn{
        padding:13px 12px;
    }

    .task-actions button{
        flex:1;
        min-width:90px;
    }

}


footer.dev-footer{
    text-align:center;
    padding:22px 15px 30px;
    color:#607d8b;
    font-size:13.5px;
}

footer.dev-footer .dev-name{
    font-weight:bold;
    color:#37474f;
    font-size:14.5px;
    margin-bottom:6px;
}

footer.dev-footer a{
    color:#1976d2;
    text-decoration:none;
    font-weight:bold;
}

footer.dev-footer a:hover,
footer.dev-footer a:focus-visible{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<header>

<h1><span class="icon">📋</span> منصة مهامي الأسبوعية</h1>

<p>نظّم مهامك وتابع إنجازك بسهولة</p>

</header>


<!-- الإحصائيات -->

<div class="stats">

<div class="stat">
<strong id="totalCount">0</strong>

</div>

<div class="stat">
<strong id="completedCount">0</strong>

</div>

<div class="stat">
<strong id="remainingCount">0</strong>
<span><span class="icon">⏳</span> المتبقية</span>
</div>

<div class="stat">
<strong id="overdueCount">0</strong>

</div>


<!-- لوحة اليوم والأسبوع -->

<h2 class="dashboard-title">

<div class="dashboard">

<div class="dashboard-card" onclick="setFilter('today')">

<div class="dashboard-icon">📅</div>

<div class="dashboard-number" id="todayCount">
0

مهام اليوم

</div>


<div class="dashboard-card" onclick="setFilter('week')">

<div class="dashboard-icon">📆</div>

<div class="dashboard-number" id="weekCount">
0

<div class="dashboard-label">
هذا الأسبوع
</div>

</div>


<div class="dashboard-card" onclick="setFilter('remaining')">

<div class="dashboard-icon">⏳</div>

<div class="dashboard-number" id="upcomingCount">
0
</div>

القادمة

<div class="dashboard-card" onclick="setFilter('overdue')">

<!-- نسبة الإنجاز -->

<div class="progress-box">

<div class="progress-title">

<span><span class="icon">📊</span> نسبة الإنجاز</span>

<span id="progressText">
0%

</div>

<div class="progress">

class="progress-bar"
id="progressBar">

<!-- إضافة مهمة -->

<div class="add-box">

>

<div class="filters">

class="filter-btn active"

onclick="setFilter('all')">

onclick="setFilter('today')">

</button>

<button
class="filter-btn"
data-filter="week"
onclick="setFilter('week')">

</button>

<button
class="filter-btn"
data-filter="remaining"
onclick="setFilter('remaining')">

</button>

<button
class="filter-btn"
data-filter="completed"
onclick="setFilter('completed')">

<span class="icon">✅</span> المكتملة

</button>

class="filter-btn"
data-filter="overdue"
onclick="setFilter('overdue')">

</button>

</div>


<!-- قائمة المهام -->

<div class="section-title">

<h2>
<span class="icon">📝</span> قائمة المهام
</h2>

<button
class="delete-all"
onclick="deleteAllTasks()">

<span class="icon">🗑️</span> حذف الكل

</button>

</div>


<div
id="taskList"
class="task-list">
</div>

</div>


<!-- نافذة التعديل -->

<div
class="modal"
id="editModal">

<div class="modal-box">

<h2>
<span class="icon">✏️</span> تعديل المهمة
</h2>

type="text"
id="editTitle"
placeholder="اسم المهمة"
>

<input
type="date"
id="editDate"
>

<select id="editPriority">

<option value="high">
🔴 أولوية عالية
</option>

<option value="medium">
🟠 أولوية متوسطة
</option>

<option value="low">
🟢 أولوية منخفضة
</option>

</select>

<div class="modal-actions">

<button
class="save-btn"
onclick="saveEdit()">

<span class="icon">💾</span> حفظ

</button>

class="cancel-btn"
onclick="closeModal()">

إلغاء

</div>


<script>

let tasks = [];

try{

    tasks =
    JSON.parse(
        localStorage.getItem("myTasks")
    ) || [];

}catch(error){

    tasks = [];

}

let currentFilter = "all";

let editingId = null;


/* حفظ المهام */

function saveTasks(){

    localStorage.setItem(
        "myTasks",
        JSON.stringify(tasks)
    );

}


/* تاريخ اليوم */

function getToday(){

    const now = new Date();

    const year =
    now.getFullYear();

    const month =
    String(
        now.getMonth()+1
    ).padStart(2,"0");

    const day =
    String(
        now.getDate()
    ).padStart(2,"0");

    return year+"-"+month+"-"+day;

}


/* هل المهمة اليوم؟ */

function isToday(date){

    return date === getToday();

}


/* بداية ونهاية أسبوع تاريخ معيّن (الاثنين إلى الأحد) */

function getWeekRange(dateString){

    const target =
    new Date(
        dateString+"T00:00:00"
    );

    const day =
    target.getDay();

    const daysFromMonday =
    day === 0 ? 6 : day-1;

    const start =
    new Date(target);

    start.setDate(
        target.getDate()
        -daysFromMonday
    );

    const end =
    new Date(start);

    end.setDate(
        start.getDate()+6
    );

    return { start:start, end:end };

}


/* مفتاح يمثل أسبوع تاريخ معيّن */

function weekKey(dateString){

    const range =
    getWeekRange(dateString);

    const y =
    range.start.getFullYear();

    const m =
    String(
        range.start.getMonth()+1
    ).padStart(2,"0");

    const d =
    String(
        range.start.getDate()
    ).padStart(2,"0");

    return y+"-"+m+"-"+d;

}


/* هل المهمة هذا الأسبوع؟ */

function isThisWeek(dateString){

    if(!dateString){
        return false;
    }

    const target =
    new Date(
        dateString+"T00:00:00"
    );

    const today =
    new Date(
        getToday()+"T00:00:00"
    );

    const day =
    today.getDay();

    const daysFromMonday =
    day === 0 ? 6 : day-1;

    const start =
    new Date(today);

    start.setDate(
        today.getDate()
        -daysFromMonday
    );

    const end =
    new Date(start);

    end.setDate(
        start.getDate()+6
    );

    return (
        target >= start &&
        target <= end
    );

}


/* هل المهمة متأخرة؟ */

function isOverdue(task){

    if(
        !task.date ||
        task.completed
    ){

        return false;

    }

    return task.date < getToday();

}


/* حالة المهمة */

function getStatus(task){

    if(task.completed){

        return '<span class="icon">✅</span> مكتملة';

    }

    if(isOverdue(task)){

        return '<span class="icon">🔴</span> متأخرة';

    }

    if(isToday(task.date)){

        return '<span class="icon">📅</span> اليوم';

    }

    if(task.date){

        return '<span class="icon">📆</span> مجدولة';

    }

    return '<span class="icon">📌</span> بدون موعد';

}


/* إضافة مهمة */

function addTask(){

    const input =
    document.getElementById(
        "taskInput"
    );

    const dateInput =
    document.getElementById(
        "dateInput"
    );

    const priorityInput =
    document.getElementById(
        "priorityInput"
    );

    const title =
    input.value.trim();

    if(!title){

        alert(
            "اكتب اسم المهمة أولاً"
        );

        return;

    }

    const task = {

        id:Date.now(),

        title:title,

        date:dateInput.value,

        priority:priorityInput.value,

        completed:false

    };

    tasks.push(task);

    saveTasks();

    input.value="";

    dateInput.value="";

    priorityInput.value="medium";

    renderTasks();

    updateStats();

}


/* البحث */

function searchTasks(){

    renderTasks();

}


/* فلترة المهام */

function filterTasks(){

    const search =
    document.getElementById(
        "searchInput"
    ).value
    .trim()
    .toLowerCase();

    let result =
    tasks.filter(function(task){

        const matchesSearch =
        task.title
        .toLowerCase()
        .includes(search);

        if(!matchesSearch){

            return false;

        }

        if(currentFilter === "today"){

            return isToday(task.date);

        }

        if(currentFilter === "week"){

            return isThisWeek(task.date);

        }

        if(currentFilter === "remaining"){

            return !task.completed;

        }

        if(currentFilter === "completed"){

            return task.completed;

        }

        if(currentFilter === "overdue"){

            return isOverdue(task);

        }

        return true;

    });

    result.sort(function(a,b){

        if(
            a.completed !==
            b.completed
        ){

            return a.completed
            ? 1
            : -1;

        }

        if(a.date && b.date){

            return a.date.localeCompare(
                b.date
            );

        }

        if(a.date){

            return -1;

        }

        if(b.date){

            return 1;

        }

        return 0;

    });

    return result;

}


/* حماية النص */

function escapeHtml(text){

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}


/* عرض المهام */

function renderTasks(){

    const list =
    document.getElementById(
        "taskList"
    );

    const filtered =
    filterTasks();

    if(filtered.length === 0){

        let message =
        '<span class="icon">📭</span> لا توجد مهام مطابقة';

        if(currentFilter === "today"){

            message =
            '<span class="icon">📅</span> لا توجد مهام اليوم';

        }

        if(currentFilter === "week"){

            message =
            '<span class="icon">📆</span> لا توجد مهام هذا الأسبوع';

        }

        if(currentFilter === "remaining"){

            message =
            '<span class="icon">⏳</span> لا توجد مهام متبقية';

        }

        if(currentFilter === "completed"){

            message =
            '<span class="icon">✅</span> لا توجد مهام مكتملة';

        }

        if(currentFilter === "overdue"){

            message =
            '<span class="icon">🔴</span> لا توجد مهام متأخرة';

        }

        list.innerHTML =
        '<div class="empty">'+
        message+
        '</div>';

        return;

    }


    let html = "";


    filtered.forEach(function(task){

        let dateText =
        "بدون موعد";

        if(task.date){

            const d =
            new Date(
                task.date+
                "T00:00:00"
            );

            dateText =
            d.toLocaleDateString(
                "ar-EG",
                {
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );

        }


        let priorityText =
        '<span class="icon">🟠</span> متوسطة';

        let priorityClass =
        "medium";

        if(task.priority === "high"){

            priorityText =
            '<span class="icon">🔴</span> عالية';

            priorityClass =
            "high";

        }

        if(task.priority === "low"){

            priorityText =
            '<span class="icon">🟢</span> منخفضة';

            priorityClass =
            "low";

        }


        const status =
        getStatus(task);


        html +=

        '<div class="task '+
        (task.completed ? "completed " : "")+
        (isOverdue(task) ? "overdue" : "")+
        '">';


        html +=
        '<div class="task-title">'+
        escapeHtml(task.title)+
        '</div>';


        html +=
        '<div class="task-info">';


        html +=
        '<span class="badge date-badge">'+
        '<span class="icon">📅</span> '+dateText+
        '</span>';


        html +=
        '<span class="badge '+
        priorityClass+
        '">'+
        priorityText+
        '</span>';


        html +=
        '<span class="badge status">'+
        status+
        '</span>';


        html +=
        '</div>';


        html +=
        '<div class="task-actions">';


        html +=
        '<button class="complete-btn" '+
        'onclick="toggleComplete('+
        task.id+
        ')">'+
        (task.completed
        ? '<span class="icon">↩️</span> إعادة فتح'
        : '<span class="icon">✅</span> إنجاز')+
        '</button>';


        html +=
        '<button class="edit-btn" '+
        'onclick="openEdit('+
        task.id+
        ')">'+
        '<span class="icon">✏️</span> تعديل'+
        '</button>';


        html +=
        '<button class="delete-btn" '+
        'onclick="deleteTask('+
        task.id+
        ')">'+
        '<span class="icon">🗑️</span> حذف'+
        '</button>';


        html +=
        '</div>';


        html +=
        '</div>';

    });


    list.innerHTML =
    html;

}


/* الفلتر */

function setFilter(filter){

    currentFilter =
    filter;

    const buttons =
    document.querySelectorAll(
        ".filter-btn"
    );

    buttons.forEach(
    function(button){

        button.classList.remove(
            "active"
        );

        if(
            button.dataset.filter ===
            filter
        ){

            button.classList.add(
                "active"
            );

        }

    });


    renderTasks();

}


/* حذف مهام أسبوع منتهٍ تمّت كل مهامه */

function cleanupFinishedWeek(task){

    if(!task.date){
        return;
    }

    const range =
    getWeekRange(task.date);

    const todayDate =
    new Date(
        getToday()+"T00:00:00"
    );

    if(range.end >= todayDate){

        return;

    }

    const wk =
    weekKey(task.date);

    const weekTasks =
    tasks.filter(function(item){

        return (
            item.date &&
            weekKey(item.date) === wk
        );

    });

    const allDone =
    weekTasks.length > 0 &&
    weekTasks.every(function(item){

        return item.completed;

    });

    if(allDone){

        tasks =
        tasks.filter(function(item){

            return !(
                item.date &&
                weekKey(item.date) === wk
            );

        });

        saveTasks();

    }

}


/* إنجاز المهمة */

function toggleComplete(id){

    const task =
    tasks.find(
        function(item){
            return item.id === id;
        }
    );

    if(!task){
        return;
    }

    task.completed =
    !task.completed;

    saveTasks();

    if(task.completed){

        cleanupFinishedWeek(task);

    }

    renderTasks();

    updateStats();

}


/* حذف مهمة */

function deleteTask(id){

    const task =
    tasks.find(
        function(item){
            return item.id === id;
        }
    );

    if(!task){
        return;
    }

    const answer =
    confirm(
        'هل تريد حذف المهمة "'+
        task.title+
        '"؟'
    );

    if(answer){

        tasks =
        tasks.filter(
            function(item){
                return item.id !== id;
            }
        );

        saveTasks();

        renderTasks();

        updateStats();

    }

}


/* حذف الكل */

function deleteAllTasks(){

    if(tasks.length === 0){

        alert(
            "لا توجد مهام لحذفها"
        );

        return;

    }

    const answer =
    confirm(
        "⚠️ هل أنت متأكد من حذف جميع المهام؟"
    );

    if(answer){

        tasks = [];

        saveTasks();

        renderTasks();

        updateStats();

    }

}


/* فتح التعديل */

function openEdit(id){

    const task =
    tasks.find(
        function(item){
            return item.id === id;
        }
    );

    if(!task){
        return;
    }

    editingId =
    id;

    document.getElementById(
        "editTitle"
    ).value =
    task.title;

    document.getElementById(
        "editDate"
    ).value =
    task.date || "";

    document.getElementById(
        "editPriority"
    ).value =
    task.priority || "medium";

    document.getElementById(
        "editModal"
    ).style.display =
    "flex";

}


/* حفظ التعديل */

function saveEdit(){

    const task =
    tasks.find(
        function(item){
            return item.id === editingId;
        }
    );

    if(!task){
        return;
    }

    const title =
    document.getElementById(
        "editTitle"
    ).value.trim();

    if(!title){

        alert(
            "اكتب اسم المهمة"
        );

        return;

    }

    task.title =
    title;

    task.date =
    document.getElementById(
        "editDate"
    ).value;

    task.priority =
    document.getElementById(
        "editPriority"
    ).value;

    saveTasks();

    closeModal();

    renderTasks();

    updateStats();

}


/* إغلاق نافذة التعديل */

function closeModal(){

    document.getElementById(
        "editModal"
    ).style.display =
    "none";

    editingId =
    null;

}


/* الإحصائيات */

function updateStats(){

    const total =
    tasks.length;

    const completed =
    tasks.filter(
        function(task){
            return task.completed;
        }
    ).length;

    const remaining =
    total -
    completed;

    const overdue =
    tasks.filter(
        function(task){
            return isOverdue(task);
        }
    ).length;

    const today =
    tasks.filter(
        function(task){
            return isToday(
                task.date
            );
        }
    ).length;

    const week =
    tasks.filter(
        function(task){
            return isThisWeek(
                task.date
            );
        }
    ).length;

    const upcoming =
    tasks.filter(
        function(task){

            return (
                !task.completed &&
                task.date &&
                task.date >= getToday()
            );

        }
    ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
    total;


    document.getElementById(
        "completedCount"
    ).textContent =
    completed;


    document.getElementById(
        "remainingCount"
    ).textContent =
    remaining;


    document.getElementById(
        "overdueCount"
    ).textContent =
    overdue;


    document.getElementById(
        "todayCount"
    ).textContent =
    today;


    document.getElementById(
        "weekCount"
    ).textContent =
    week;


    document.getElementById(
        "upcomingCount"
    ).textContent =
    upcoming;


    document.getElementById(
        "dashboardOverdue"
    ).textContent =
    overdue;


    const percentage =
    total === 0
    ? 0
    : Math.round(
        (completed / total) *
        100
    );


    document.getElementById(
        "progressBar"
    ).style.width =
    percentage+"%";


    document.getElementById(
        "progressText"
    ).textContent =
    percentage+"%";

}


/* Enter لإضافة مهمة */

document.getElementById(
    "taskInput"
).addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            addTask();

        }

    }
);


/* Enter للبحث */

document.getElementById(
    "searchInput"
).addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchTasks();

        }

    }
);


/* الضغط خارج نافذة التعديل */

document.getElementById(
    "editModal"
).addEventListener(
    "click",
    function(event){

        if(event.target === this){

            closeModal();

        }

    }
);


/* تشغيل الصفحة */

renderTasks();

updateStats();

</script>
