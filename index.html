<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة مهامي الأسبوعية</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#e8f5e9,#e3f2fd);
    color:#263238;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

header{
    background:linear-gradient(135deg,#1976d2,#2e7d32);
    color:white;
    padding:25px 18px;
    border-radius:20px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

header h1{
    margin:0 0 8px;
    font-size:28px;
}

header p{
    margin:0;
    font-size:16px;
}

/* الإحصائيات */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:15px 8px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.stat strong{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.stat span{
    font-size:14px;
    font-weight:bold;
}

/* التقدم */

.progress-box{
    background:white;
    padding:16px;
    border-radius:15px;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.progress-title{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
}

.progress{
    height:13px;
    background:#e0e0e0;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#43a047,#1e88e5);
    transition:.3s;
}

/* إضافة مهمة */

.add-box{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.add-box h2{
    margin-top:0;
    font-size:20px;
}

input,select{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    background:#fafafa;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn{
    width:100%;
    background:#2e7d32;
    color:white;
}

/* البحث */

.search-box{
    background:white;
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.search-box input{
    margin:0;
}

/* الفلاتر */

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:18px;
}

.filter-btn{
    background:white;
    color:#37474f;
    border:1px solid #ddd;
}

.filter-btn.active{
    background:#1976d2;
    color:white;
}

/* عنوان القسم */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-title h2{
    font-size:21px;
    margin:0;
}

.delete-all{
    background:#d32f2f;
    color:white;
    font-size:13px;
    padding:9px 12px;
}

/* المهام */

.task-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.task{
    background:white;
    border-radius:17px;
    padding:17px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    border-right:6px solid #1976d2;
}

.task.completed{
    border-right-color:#43a047;
    opacity:.82;
}

.task.overdue{
    border-right-color:#d32f2f;
}

.task-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
    word-break:break-word;
}

.task.completed .task-title{
    text-decoration:line-through;
}

.task-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
}

.badge{
    padding:6px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.date-badge{
    background:#e3f2fd;
    color:#1565c0;
}

.high{
    background:#ffebee;
    color:#c62828;
}

.medium{
    background:#fff8e1;
    color:#ef6c00;
}

.low{
    background:#e8f5e9;
    color:#2e7d32;
}

.status{
    background:#f5f5f5;
    color:#455a64;
}

.task-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.complete-btn{
    background:#43a047;
    color:white;
}

.edit-btn{
    background:#1976d2;
    color:white;
}

.delete-btn{
    background:#d32f2f;
    color:white;
}

.empty{
    background:white;
    border-radius:17px;
    padding:30px 15px;
    text-align:center;
    color:#607d8b;
    box-shadow:0 4px 12px rgba(0,0,0,.07);
}

/* النافذة */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    border-radius:20px;
    padding:20px;
}

.modal-box h2{
    margin-top:0;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.save-btn{
    background:#1976d2;
    color:white;
    flex:1;
}

.cancel-btn{
    background:#eeeeee;
    flex:1;
}

/* الهاتف */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    header h1{
        font-size:24px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .task-title{
        font-size:18px;
    }

    .task-actions button{
        flex:1;
        min-width:90px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📋 منصة مهامي الأسبوعية</h1>
    <p>نظّم مهامك وتابع إنجازك بسهولة</p>
</header>

<!-- الإحصائيات -->

<div class="stats">

    <div class="stat">
        <strong id="totalCount">0</strong>
        <span>📋 الكل</span>
    </div>

    <div class="stat">
        <strong id="completedCount">0</strong>
        <span>✅ المكتملة</span>
    </div>

    <div class="stat">
        <strong id="remainingCount">0</strong>
        <span>⏳ المتبقية</span>
    </div>

    <div class="stat">
        <strong id="overdueCount">0</strong>
        <span>🔴 المتأخرة</span>
    </div>

</div>

<!-- نسبة الإنجاز -->

<div class="progress-box">

    <div class="progress-title">
        <span>📊 نسبة الإنجاز</span>
        <span id="progressText">0%</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

</div>

<!-- إضافة مهمة -->

<div class="add-box">

    <h2>➕ إضافة مهمة جديدة</h2>

    <input
        type="text"
        id="taskInput"
        placeholder="اكتب اسم المهمة..."
    >

    <input
        type="date"
        id="dateInput"
    >

    <select id="priorityInput">

        <option value="high">🔴 أولوية عالية</option>

        <option value="medium" selected>
            🟠 أولوية متوسطة
        </option>

        <option value="low">
            🟢 أولوية منخفضة
        </option>

    </select>

    <button class="add-btn" onclick="addTask()">
        ➕ إضافة المهمة
    </button>

</div>

<!-- البحث -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="🔎 ابحث عن مهمة..."
        oninput="renderTasks()"
    >

</div>

<!-- الفلاتر -->

<div class="filters">

    <button
        class="filter-btn active"
        data-filter="all"
        onclick="setFilter('all')">
        📋 الكل
    </button>

    <button
        class="filter-btn"
        data-filter="today"
        onclick="setFilter('today')">
        📅 اليوم
    </button>

    <button
        class="filter-btn"
        data-filter="week"
        onclick="setFilter('week')">
        📆 هذا الأسبوع
    </button>

    <button
        class="filter-btn"
        data-filter="remaining"
        onclick="setFilter('remaining')">
        ⏳ المتبقية
    </button>

    <button
        class="filter-btn"
        data-filter="completed"
        onclick="setFilter('completed')">
        ✅ المكتملة
    </button>

    <button
        class="filter-btn"
        data-filter="overdue"
        onclick="setFilter('overdue')">
        🔴 المتأخرة
    </button>

</div>

<!-- قائمة المهام -->

<div class="section-title">

    <h2>📝 قائمة المهام</h2>

    <button
        class="delete-all"
        onclick="deleteAllTasks()">
        🗑️ حذف الكل
    </button>

</div>

<div id="taskList" class="task-list"></div>

</div>


<!-- نافذة تعديل المهمة -->

<div class="modal" id="editModal">

    <div class="modal-box">

        <h2>✏️ تعديل المهمة</h2>

        <input
            type="text"
            id="editTitle"
            placeholder="اسم المهمة"
        >

        <input
            type="date"
            id="editDate"
        >

        <select id="editPriority">

            <option value="high">
                🔴 أولوية عالية
            </option>

            <option value="medium">
                🟠 أولوية متوسطة
            </option>

            <option value="low">
                🟢 أولوية منخفضة
            </option>

        </select>

        <div class="modal-actions">

            <button
                class="save-btn"
                onclick="saveEdit()">
                💾 حفظ
            </button>

            <button
                class="cancel-btn"
                onclick="closeModal()">
                إلغاء
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   البيانات
========================= */

let tasks = JSON.parse(
    localStorage.getItem("myTasks")
) || [];

let currentFilter = "all";
let editingId = null;


/* =========================
   حفظ البيانات
========================= */

function saveTasks(){

    localStorage.setItem(
        "myTasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   التاريخ المحلي
========================= */

function getToday(){

    const now = new Date();

    const year = now.getFullYear();

    const month = String(
        now.getMonth() + 1
    ).padStart(2,"0");

    const day = String(
        now.getDate()
    ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =========================
   معرفة هل المهمة اليوم
========================= */

function isToday(date){

    return date === getToday();

}


/* =========================
   معرفة هل المهمة هذا الأسبوع
   الإثنين إلى الأحد
========================= */

function isThisWeek(dateString){

    if(!dateString){
        return false;
    }

    const target =
        new Date(dateString + "T00:00:00");

    const today =
        new Date(getToday() + "T00:00:00");

    const day = today.getDay();

    const daysFromMonday =
        day === 0 ? 6 : day - 1;

    const start = new Date(today);

    start.setDate(
        today.getDate() - daysFromMonday
    );

    const end = new Date(start);

    end.setDate(
        start.getDate() + 6
    );

    return target >= start && target <= end;

}


/* =========================
   معرفة التأخير
========================= */

function isOverdue(task){

    if(!task.date || task.completed){
        return false;
    }

    return task.date < getToday();

}


/* =========================
   حالة المهمة
========================= */

function getStatus(task){

    if(task.completed){

        return {
            text:"✅ مكتملة",
            class:"status"
        };

    }

    if(isOverdue(task)){

        return {
            text:"🔴 متأخرة",
            class:"status"
        };

    }

    if(isToday(task.date)){

        return {
            text:"📅 اليوم",
            class:"status"
        };

    }

    if(task.date){

        const today =
            new Date(getToday());

        const taskDate =
            new Date(task.date + "T00:00:00");

        const diff =
            Math.ceil(
                (taskDate - today) /
                (1000 * 60 * 60 * 24)
            );

        if(diff <= 2){

            return {
                text:"⏰ قريباً",
                class:"status"
            };

        }

        return {
            text:"📆 مجدولة",
            class:"status"
        };

    }

    return {
        text:"📌 بدون موعد",
        class:"status"
    };

}


/* =========================
   إضافة مهمة
========================= */

function addTask(){

    const title =
        document
        .getElementById("taskInput")
        .value
        .trim();

    const date =
        document
        .getElementById("dateInput")
        .value;

    const priority =
        document
        .getElementById("priorityInput")
        .value;

    if(!title){

        alert("اكتب اسم المهمة أولاً");

        return;

    }

    const task = {

        id:Date.now(),

        title:title,

        date:date,

        priority:priority,

        completed:false

    };

    tasks.push(task);

    saveTasks();

    document.getElementById("taskInput").value = "";

    document.getElementById("dateInput").value = "";

    renderTasks();

    updateStats();

}


/* =========================
   ترتيب المهام
========================= */

function sortTasks(list){

    return list.sort((a,b)=>{

        if(a.completed !== b.completed){

            return a.completed ? 1 : -1;

        }

        if(a.date && b.date){

            if(a.date !== b.date){

                return a.date.localeCompare(b.date);

            }

        }

        if(a.date && !b.date) return -1;

        if(!a.date && b.date) return 1;

        const priorityValue = {

            high:1,

            medium:2,

            low:3

        };

        return (
            priorityValue[a.priority] -
            priorityValue[b.priority]
        );

    });

}


/* =========================
   الهروب من HTML
========================= */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================
   فلترة المهام
========================= */

function filterTasks(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let filtered = tasks.filter(task=>{

        const matchesSearch =
            task.title
            .toLowerCase()
            .includes(search);

        if(!matchesSearch){

            return false;

        }

        switch(currentFilter){

            case "today":

                return isToday(task.date);

            case "week":

                return isThisWeek(task.date);

            case "remaining":

                return !task.completed;

            case "completed":

                return task.completed;

            case "overdue":

                return isOverdue(task);

            default:

                return true;

        }

    });

    return sortTasks(filtered);

}


/* =========================
   عرض المهام
========================= */

function renderTasks(){

    const list =
        document.getElementById("taskList");

    const filtered =
        filterTasks();

    if(filtered.length === 0){

        let message =
            "📭 لا توجد مهام مطابقة لهذا الاختيار";

        if(currentFilter === "today"){

            message =
                "📅 لا توجد مهام لهذا اليوم";

        }

        if(currentFilter === "week"){

            message =
                "📆 لا توجد مهام لهذا الأسبوع";

        }

        list.innerHTML =
            `<div class="empty">${message}</div>`;

        updateStats();

        return;

    }

    list.innerHTML = filtered.map(task=>{

        const status =
            getStatus(task);

        let dateText =
            "بدون موعد";

        if(task.date){

            const d =
                new Date(
                    task.date + "T00:00:00"
                );

            dateText =
                d.toLocaleDateString(
                    "ar-EG",
                    {
                        year:"numeric",
                        month:"long",
                        day:"numeric"
                    }
                );

        }

        let priorityText = "";

        if(task.priority === "high"){

            priorityText =
                `<span class="badge high">
                    🔴 عالية
                </span>`;

        }

        if(task.priority === "medium"){

            priorityText =
                `<span class="badge medium">
                    🟠 متوسطة
                </span>`;

        }

        if(task.priority === "low"){

            priorityText =
                `<span class="badge low">
                    🟢 منخفضة
                </span>`;

        }

        return `

        <div class="task
            ${task.completed ? "completed" : ""}
            ${isOverdue(task) ? "overdue" : ""}">

            <div class="task-title">

                ${escapeHtml(task.title)}

            </div>

            <div class="task-info">

                <span class="badge date-badge">

                    📅 ${dateText}

                </span>

                ${priorityText}

                <span class="badge ${status.class}">

                    ${status.text}

                </span>

            </div>

            <div class="task-actions">

                <button
                    class="complete-btn"
                    onclick="toggleComplete(${task.id})">

                    ${task.completed
                        ? "↩️ إعادة فتح"
                        : "✅ إنجاز"}

                </button>

                <button
                    class="edit-btn"
                    onclick="openEdit(${task.id})">

                    ✏️ تعديل

                </button>

                <button
                    class="delete-btn"
                    onclick="deleteTask(${task.id})">

                    🗑️ حذف

                </button>

            </div>

        </div>

        `;

    }).join("");

    updateStats();

}


/* =========================
   تغيير الفلتر
========================= */

function setFilter(filter){

    currentFilter = filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(button=>{

            button.classList.remove("active");

            if(
                button.dataset.filter === filter
            ){

                button.classList.add("active");

            }

        });

    renderTasks();

}


/* =========================
   إنجاز / إعادة فتح
========================= */

function toggleComplete(id){

    const task =
        tasks.find(t=>t.id === id);

    if(!task){

        return;

    }

    task.completed =
        !task.completed;

    saveTasks();

    renderTasks();

    updateStats();

}


/* =========================
   حذف مهمة
========================= */

function deleteTask(id){

    const task =
        tasks.find(t=>t.id === id);

    if(!task){

        return;

    }

    if(
        confirm(
            `هل تريد حذف المهمة "${task.title}"؟`
        )
    ){

        tasks =
            tasks.filter(t=>t.id !== id);

        saveTasks();

        renderTasks();

        updateStats();

    }

}


/* =========================
   حذف جميع المهام
========================= */

function deleteAllTasks(){

    if(tasks.length === 0){

        alert("لا توجد مهام لحذفها");

        return;

    }

    if(
        confirm(
            "⚠️ هل أنت متأكد من حذف جميع المهام؟"
        )
    ){

        tasks = [];

        saveTasks();

        renderTasks();

        updateStats();

    }

}


/* =========================
   فتح التعديل
========================= */

function openEdit(id){

    const task =
        tasks.find(t=>t.id === id);

    if(!task){

        return;

    }

    editingId = id;

    document
        .getElementById("editTitle")
        .value = task.title;

    document
        .getElementById("editDate")
        .value = task.date || "";

    document
        .getElementById("editPriority")
        .value = task.priority;

    document
        .getElementById("editModal")
        .style.display = "flex";

}


/* =========================
   حفظ التعديل
========================= */

function saveEdit(){

    const task =
        tasks.find(t=>t.id === editingId);

    if(!task){

        return;

    }

    const title =
        document
        .getElementById("editTitle")
        .value
        .trim();

    if(!title){

        alert("اكتب اسم المهمة");

        return;

    }

    task.title = title;

    task.date =
        document
        .getElementById("editDate")
        .value;

    task.priority =
        document
        .getElementById("editPriority")
        .value;

    saveTasks();

    closeModal();

    renderTasks();

    updateStats();

}


/* =========================
   إغلاق النافذة
========================= */

function closeModal(){

    document
        .getElementById("editModal")
        .style.display = "none";

    editingId = null;

}


/* إغلاق النافذة عند الضغط خارجها */

document
    .getElementById("editModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeModal();

            }

        }
    );


/* =========================
   الإحصائيات
========================= */

function updateStats(){

    const total =
        tasks.length;

    const completed =
        tasks.filter(
            t=>t.completed
        ).length;

    const remaining =
        total - completed;

    const overdue =
        tasks.filter(
            t=>isOverdue(t)
        ).length;

    document
        .getElementById("totalCount")
        .textContent = total;

    document
        .getElementById("completedCount")
        .textContent = completed;

    document
        .getElementById("remainingCount")
        .textContent = remaining;

    document
        .getElementById("overdueCount")
        .textContent = overdue;

    const percentage =
        total === 0
        ? 0
        : Math.round(
            (completed / total) * 100
        );

    document
        .getElementById("progressBar")
        .style.width =
        percentage + "%";

    document
        .getElementById("progressText")
        .textContent =
        percentage + "%";

}


/* =========================
   زر Enter لإضافة المهمة
========================= */

document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                addTask();

            }

        }
    );


/* =========================
   التشغيل الأول
========================= */

renderTasks();

updateStats();

</script>

</body>
</html>
