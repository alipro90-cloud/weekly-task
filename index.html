<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">
<title>منصة مهامي الأسبوعية</title>

<style>
:root{
    --bg1:#e8f5e9;
    --bg2:#e3f2fd;
    --card:#ffffff;
    --text:#263238;
    --muted:#607d8b;
    --primary:#1976d2;
    --success:#2e7d32;
    --danger:#d32f2f;
    --warning:#b85600;
    --border:#e0e0e0;
    --shadow:0 4px 12px rgba(0,0,0,.08);
    --shadow-lg:0 10px 30px rgba(0,0,0,.15);
}

html[data-theme="dark"]{
    --bg1:#0f1720;
    --bg2:#0b1220;
    --card:#1a2431;
    --text:#e6eef8;
    --muted:#8aa0b6;
    --primary:#42a5f5;
    --success:#66bb6a;
    --danger:#ef5350;
    --warning:#ffb74d;
    --border:#2b3849;
    --shadow:0 4px 12px rgba(0,0,0,.35);
    --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Segoe UI',Tahoma,'Noto Kufi Arabic',Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    transition:background .3s,color .3s;
    min-height:100vh;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.icon{font-size:.95em}

/* ===== Header ===== */

header{
    position:relative;
    background:linear-gradient(135deg,var(--primary),var(--success));
    color:#fff;
    padding:22px 15px;
    border-radius:20px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

header h1{
    margin:0 0 6px;
    font-size:26px;
    letter-spacing:.5px;
}

header p{
    margin:0;
    font-size:15px;
    opacity:.95;
}

.header-tools{
    position:absolute;
    top:12px;
    left:12px;
    display:flex;
    gap:6px;
}

.icon-btn{
    background:rgba(255,255,255,.2);
    color:#fff;
    border:none;
    width:36px;
    height:36px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.icon-btn:hover{
    background:rgba(255,255,255,.35);
    transform:translateY(-1px);
}

/* ===== Stats ===== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:var(--card);
    padding:15px 8px;
    border-radius:15px;
    text-align:center;
    box-shadow:var(--shadow);
}

.stat strong{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

.stat span{font-size:13px;font-weight:bold}

/* ===== Progress ===== */

.progress-box{
    background:var(--card);
    padding:16px;
    border-radius:16px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

.progress-title{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
    font-size:14px;
}

.progress{
    height:12px;
    background:var(--border);
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:linear-gradient(90deg,var(--primary),var(--success));
    transition:width .4s ease;
}

/* ===== Add box ===== */

.add-box{
    background:var(--card);
    padding:18px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

.add-box h2{
    margin-top:0;
    font-size:19px;
}

input,select,button{
    font-family:inherit;
    font-size:16px;
}

input,select{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--card);
    color:var(--text);
    transition:.2s;
}

input:focus,select:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(25,118,210,.15);
}

button{
    border:none;
    border-radius:11px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}

.add-btn{
    width:100%;
    background:var(--success);
    color:#fff;
}

.add-btn:hover{filter:brightness(1.08)}

/* ===== Search ===== */

.search-box{
    background:var(--card);
    padding:14px;
    border-radius:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
}

.search-row{display:flex;gap:8px;align-items:center}
.search-row input{flex:1;margin:0}

.search-btn{
    background:var(--primary);
    color:#fff;
    white-space:nowrap;
}

/* ===== Filters ===== */

.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:18px;
}

.filter-btn{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    font-size:14px;
}

.filter-btn.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

/* ===== Section Title ===== */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:8px;
}

.section-title h2{
    margin:0;
    font-size:20px;
}

.delete-all{
    background:var(--danger);
    color:#fff;
    font-size:14px;
    padding:9px 12px;
}

/* ===== Tasks ===== */

.task-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.task{
    background:var(--card);
    padding:16px;
    border-radius:17px;
    border-right:6px solid var(--primary);
    box-shadow:var(--shadow);
    transition:transform .2s,box-shadow .2s;
    animation:slideIn .25s ease;
}

@keyframes slideIn{
    from{opacity:0;transform:translateY(-8px)}
    to{opacity:1;transform:translateY(0)}
}

.task:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-lg);
}

.task.completed{
    border-right-color:var(--success);
    opacity:.75;
}

.task.overdue{
    border-right-color:var(--danger);
}

.task-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    word-break:break-word;
}

.task.completed .task-title{
    text-decoration:line-through;
    color:var(--muted);
}

.task-info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:12px;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.date-badge{background:rgba(25,118,210,.12);color:var(--primary)}
.high{background:rgba(211,47,47,.12);color:var(--danger)}
.medium{background:rgba(184,86,0,.12);color:var(--warning)}
.low{background:rgba(46,125,50,.12);color:var(--success)}
.status{background:rgba(120,120,120,.12);color:var(--muted)}

.task-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.task-actions button{
    flex:1;
    min-width:90px;
    font-size:14px;
    padding:10px 12px;
}

.complete-btn{background:var(--success);color:#fff}
.edit-btn{background:var(--primary);color:#fff}
.delete-btn{background:var(--danger);color:#fff}

/* ===== Empty ===== */

.empty{
    background:var(--card);
    padding:35px 15px;
    border-radius:17px;
    text-align:center;
    color:var(--muted);
    font-size:16px;
    box-shadow:var(--shadow);
}

.empty .big{
    display:block;
    font-size:44px;
    margin-bottom:8px;
}

/* ===== Dashboard ===== */

.dashboard-title{
    font-size:19px;
    margin:18px 0 10px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

.dashboard-card{
    background:var(--card);
    padding:14px 8px;
    border-radius:15px;
    text-align:center;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:.2s;
}

.dashboard-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-lg);
}

.dashboard-icon{font-size:18px}
.dashboard-number{font-size:23px;font-weight:bold;margin:4px 0}
.dashboard-label{font-size:12px;font-weight:bold;color:var(--muted)}

/* ===== Modal ===== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
    backdrop-filter:blur(4px);
}

.modal.show{display:flex;animation:fadeIn .2s}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal-box{
    width:100%;
    max-width:500px;
    background:var(--card);
    color:var(--text);
    padding:22px;
    border-radius:20px;
    box-shadow:var(--shadow-lg);
    animation:popIn .25s ease;
}

@keyframes popIn{
    from{opacity:0;transform:scale(.95)}
    to{opacity:1;transform:scale(1)}
}

.modal-box h2{
    margin-top:0;
    font-size:19px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
}

.save-btn{
    flex:1;
    background:var(--primary);
    color:#fff;
}

.cancel-btn{
    flex:1;
    background:var(--border);
    color:var(--text);
}

/* ===== Backup ===== */

.backup-box{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.backup-btn{
    flex:1;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
}

/* ===== Toast ===== */

#toastWrap{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:2000;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:min(92%,420px);
}

.toast{
    background:var(--card);
    color:var(--text);
    padding:12px 16px;
    border-radius:12px;
    box-shadow:var(--shadow-lg);
    border-right:5px solid var(--primary);
    display:flex;
    align-items:center;
    gap:10px;
    animation:toastIn .3s ease;
    font-size:14px;
    font-weight:600;
}

.toast.success{border-right-color:var(--success)}
.toast.error{border-right-color:var(--danger)}
.toast.warn{border-right-color:var(--warning)}
.toast .undo{
    margin-inline-start:auto;
    background:transparent;
    color:var(--primary);
    padding:6px 10px;
    font-size:13px;
    border:1px solid var(--primary);
    border-radius:8px;
}

@keyframes toastIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

.toast.out{
    animation:toastOut .3s ease forwards;
}

@keyframes toastOut{
    to{opacity:0;transform:translateY(20px)}
}

/* ===== Footer ===== */

footer.dev-footer{
    text-align:center;
    padding:16px 15px 24px;
    color:var(--warning);
    font-size:11px;
}

footer.dev-footer .dev-name{
    font-weight:bold;
    font-size:12px;
    margin-bottom:3px;
}

footer.dev-footer a{
    color:var(--warning);
    text-decoration:none;
    font-weight:bold;
}

footer.dev-footer a:hover{text-decoration:underline}

/* ===== Confirm dialog ===== */

.confirm-body{
    padding:6px 2px 12px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

.confirm-actions{
    display:flex;
    gap:10px;
}

.confirm-actions button{
    flex:1;
}

.confirm-yes{background:var(--danger);color:#fff}
.confirm-no{background:var(--border);color:var(--text)}

/* ===== Mobile ===== */

@media(max-width:600px){

    .container{padding:12px}

    header h1{font-size:22px}

    .stats{grid-template-columns:repeat(2,1fr)}
    .dashboard{grid-template-columns:repeat(2,1fr)}
    .filters{grid-template-columns:repeat(2,1fr)}

    .task-actions button{
        flex:1 1 calc(50% - 4px);
        min-width:0;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="header-tools">
        <button class="icon-btn" id="themeBtn" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙</button>
    </div>
    <h1>📋 مهام الأسبوع</h1>
    <p>نظّم مهامك وتابع إنجازك بسهولة</p>
</header>

<!-- الإحصائيات -->
<div class="stats">
    <div class="stat"><strong id="totalCount">0</strong><span>📋 الكل</span></div>
    <div class="stat"><strong id="completedCount">0</strong><span>✅ المكتملة</span></div>
    <div class="stat"><strong id="remainingCount">0</strong><span>⏳ المتبقية</span></div>
    <div class="stat"><strong id="overdueCount">0</strong><span>🔴 المتأخرة</span></div>
</div>

<!-- لوحة الملخص -->
<h2 class="dashboard-title">📊 ملخص المهام</h2>

<div class="dashboard">
    <div class="dashboard-card" onclick="setFilter('today')" role="button" tabindex="0">
        <div class="dashboard-icon">📅</div>
        <div class="dashboard-number" id="todayCount">0</div>
        <div class="dashboard-label">مهام اليوم</div>
    </div>
    <div class="dashboard-card" onclick="setFilter('week')" role="button" tabindex="0">
        <div class="dashboard-icon">📆</div>
        <div class="dashboard-number" id="weekCount">0</div>
        <div class="dashboard-label">هذا الأسبوع</div>
    </div>
    <div class="dashboard-card" onclick="setFilter('upcoming')" role="button" tabindex="0">
        <div class="dashboard-icon">⏳</div>
        <div class="dashboard-number" id="upcomingCount">0</div>
        <div class="dashboard-label">القادمة</div>
    </div>
    <div class="dashboard-card" onclick="setFilter('overdue')" role="button" tabindex="0">
        <div class="dashboard-icon">🔴</div>
        <div class="dashboard-number" id="dashboardOverdue">0</div>
        <div class="dashboard-label">المتأخرة</div>
    </div>
</div>

<!-- نسبة الإنجاز -->
<div class="progress-box">
    <div class="progress-title">
        <span>📊 نسبة الإنجاز</span>
        <span id="progressText">0%</span>
    </div>
    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<!-- إضافة مهمة -->
<div class="add-box">
    <h2>➕ إضافة مهمة جديدة</h2>
    <input type="text" id="taskInput" placeholder="اكتب اسم المهمة..." autocomplete="off">
    <input type="date" id="dateInput">
    <select id="priorityInput">
        <option value="high">🔴 أولوية عالية</option>
        <option value="medium" selected>🟠 أولوية متوسطة</option>
        <option value="low">🟢 أولوية منخفضة</option>
    </select>
    <button class="add-btn" onclick="addTask()">➕ إضافة المهمة</button>
</div>

<!-- البحث -->
<div class="search-box">
    <div class="search-row">
        <input type="text" id="searchInput" placeholder="ابحث عن مهمة..." oninput="searchTasks()">
        <button class="search-btn" onclick="searchTasks()">🔎 بحث</button>
    </div>
</div>

<!-- الفلاتر -->
<div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📋 الكل</button>
    <button class="filter-btn" data-filter="today" onclick="setFilter('today')">📅 اليوم</button>
    <button class="filter-btn" data-filter="week" onclick="setFilter('week')">📆 الأسبوع</button>
    <button class="filter-btn" data-filter="remaining" onclick="setFilter('remaining')">⏳ المتبقية</button>
    <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">✅ المكتملة</button>
    <button class="filter-btn" data-filter="overdue" onclick="setFilter('overdue')">🔴 المتأخرة</button>
    <button class="filter-btn" data-filter="nodate" onclick="setFilter('nodate')">📌 بدون موعد</button>
    <button class="filter-btn" data-filter="high" onclick="setFilter('high')">⚡ عالية الأهمية</button>
</div>

<!-- قائمة المهام -->
<div class="section-title">
    <h2>📝 قائمة المهام</h2>
    <button class="delete-all" onclick="deleteAllTasks()">🗑️ حذف الكل</button>
</div>

<div id="taskList" class="task-list"></div>

<!-- نسخة احتياطية -->
<div class="backup-box">
    <button class="backup-btn" onclick="exportTasks()">⬇️ حفظ نسخة</button>
    <button class="backup-btn" onclick="document.getElementById('importFile').click()">⬆️ استرجاع</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
</div>

</div>

<!-- نافذة التعديل -->
<div class="modal" id="editModal" role="dialog" aria-modal="true">
    <div class="modal-box">
        <h2>✏️ تعديل المهمة</h2>
        <input type="text" id="editTitle" placeholder="اسم المهمة">
        <input type="date" id="editDate">
        <select id="editPriority">
            <option value="high">🔴 أولوية عالية</option>
            <option value="medium">🟠 أولوية متوسطة</option>
            <option value="low">🟢 أولوية منخفضة</option>
        </select>
        <div class="modal-actions">
            <button class="save-btn" onclick="saveEdit()">💾 حفظ</button>
            <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<!-- نافذة التأكيد -->
<div class="modal" id="confirmModal" role="dialog" aria-modal="true">
    <div class="modal-box">
        <h2 id="confirmTitle">تأكيد</h2>
        <div class="confirm-body" id="confirmBody"></div>
        <div class="confirm-actions">
            <button class="confirm-yes" id="confirmYes">تأكيد</button>
            <button class="confirm-no" id="confirmNo">إلغاء</button>
        </div>
    </div>
</div>

<!-- حاوية التنبيهات -->
<div id="toastWrap" aria-live="polite"></div>

<footer class="dev-footer">
    <div class="dev-name">Developer: Ali</div>

        💬 WhatsApp: 01226820665
    </a>
</footer>

<script>
"use strict";

/* =========================================================
   الحالة العامة
========================================================= */

const STORAGE_KEY = "myTasks";
const THEME_KEY   = "myTasksTheme";
const AUTO_CLEAN_WEEK = true;   // ✅ مُفعّلة الآن
const CHANNEL_NAME = "myTasksSync";

let tasks = [];
let currentFilter = "all";
let editingId = null;
let confirmCallback = null;

/* مزامنة بين التبويبات */
const channel = ("BroadcastChannel" in window)
    ? new BroadcastChannel(CHANNEL_NAME)
    : null;

/* =========================================================
   أدوات مساعدة
========================================================= */

const $ = (id) => document.getElementById(id);

function escapeHtml(text){
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
}

function getToday(){
    const now = new Date();
    return now.getFullYear() + "-" +
        String(now.getMonth()+1).padStart(2,"0") + "-" +
        String(now.getDate()).padStart(2,"0");
}

function normalizeArabic(text){
    return String(text)
        .toLowerCase()
        .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
        .replace(/[\u0623\u0625\u0622\u0671]/g,"\u0627")
        .replace(/\u0649/g,"\u064A")
        .replace(/\u0629/g,"\u0647");
}

/* =========================================================
   Toast (تنبيهات أنيقة)
========================================================= */

function toast(message, type = "info", opts = {}){
    const wrap = $("toastWrap");
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.innerHTML = '<span>' + escapeHtml(message) + '</span>';

    if(opts.actionLabel && typeof opts.onAction === "function"){
        const btn = document.createElement("button");
        btn.className = "undo";
        btn.textContent = opts.actionLabel;
        btn.onclick = () => {
            opts.onAction();
            remove();
        };
        el.appendChild(btn);
    }

    wrap.appendChild(el);

    const timeout = opts.duration || (opts.actionLabel ? 6000 : 3000);
    const t = setTimeout(remove, timeout);

    function remove(){
        clearTimeout(t);
        el.classList.add("out");
        setTimeout(() => el.remove(), 300);
    }
}

/* =========================================================
   Confirm مخصص
========================================================= */

function confirmDialog({title = "تأكيد", body = "", yesLabel = "تأكيد", noLabel = "إلغاء"} = {}){
    return new Promise((resolve) => {
        $("confirmTitle").textContent = title;
        $("confirmBody").innerHTML = body;
        $("confirmYes").textContent = yesLabel;
        $("confirmNo").textContent = noLabel;
        $("confirmModal").classList.add("show");

        confirmCallback = (ok) => {
            $("confirmModal").classList.remove("show");
            confirmCallback = null;
            resolve(ok);
        };
    });
}

$("confirmYes").onclick = () => confirmCallback && confirmCallback(true);
$("confirmNo").onclick  = () => confirmCallback && confirmCallback(false);
$("confirmModal").addEventListener("click", (e) => {
    if(e.target === $("confirmModal") && confirmCallback) confirmCallback(false);
});

/* =========================================================
   حفظ / تحميل
========================================================= */

function saveTasks(silent){
    try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        if(channel && !silent){
            channel.postMessage({type:"update", tasks});
        }
    }catch(e){
        console.error(e);
        toast("تعذر حفظ البيانات", "error");
    }
}

function loadTasks(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? sanitizeTasks(JSON.parse(raw)) : [];
    }catch(e){
        return [];
    }
}

function sanitizeTasks(data){
    if(!Array.isArray(data)) return [];
    const used = {};
    const clean = [];

    data.forEach((item, index) => {
        if(!item || typeof item.title !== "string") return;
        const title = item.title.trim();
        if(!title) return;

        let id = Number(item.id);
        if(!Number.isSafeInteger(id) || used[id]){
            id = Date.now() + index;
            while(used[id]) id++;
        }
        used[id] = true;

        let date = "";
        if(typeof item.date === "string" &&
           /^\d{4}-\d{2}-\d{2}$/.test(item.date) &&
           !isNaN(new Date(item.date+"T00:00:00").getTime())){
            date = item.date;
        }

        let priority = "medium";
        if(item.priority === "high" || item.priority === "low"){
            priority = item.priority;
        }

        clean.push({
            id,
            title,
            date,
            priority,
            completed: item.completed === true
        });
    });

    return clean;
}

/* =========================================================
   حساب التواريخ
========================================================= */

function isToday(date){
    return date === getToday();
}

function getWeekRange(dateString){
    const target = new Date(dateString+"T00:00:00");
    const day = target.getDay();
    const daysFromMonday = day === 0 ? 6 : day - 1;
    const start = new Date(target);
    start.setDate(target.getDate() - daysFromMonday);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return { start, end };
}

function weekKey(dateString){
    const range = getWeekRange(dateString);
    const y = range.start.getFullYear();
    const m = String(range.start.getMonth()+1).padStart(2,"0");
    const d = String(range.start.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+d;
}

function isThisWeek(dateString){
    if(!dateString) return false;
    const target = new Date(dateString+"T00:00:00");
    const range = getWeekRange(getToday());
    return target >= range.start && target <= range.end;
}

function isOverdue(task){
    if(!task.date || task.completed) return false;
    return task.date < getToday();
}

function priorityRank(task){
    if(task.priority === "high") return 0;
    if(task.priority === "low") return 2;
    return 1;
}

function getStatus(task){
    if(task.completed) return "✅ مكتملة";
    if(isOverdue(task)) return "🔴 متأخرة";
    if(isToday(task.date)) return "📅 اليوم";
    if(task.date) return "📆 مجدولة";
    return "📌 بدون موعد";
}

/* =========================================================
   التنظيف التلقائي للأسبوع المنتهي
========================================================= */

function cleanupFinishedWeek(task){
    if(!AUTO_CLEAN_WEEK || !task.date) return false;

    const range = getWeekRange(task.date);
    const today = new Date(getToday()+"T00:00:00");
    if(range.end >= today) return false;

    const wk = weekKey(task.date);
    const weekTasks = tasks.filter(t => t.date && weekKey(t.date) === wk);
    if(weekTasks.length === 0) return false;

    const allDone = weekTasks.every(t => t.completed);
    if(!allDone) return false;

    const removed = weekTasks.length;
    tasks = tasks.filter(t => !(t.date && weekKey(t.date) === wk));
    saveTasks();
    toast(`تم حذف ${removed} مهمة من أسبوع منتهي`, "success");
    return true;
}

/* =========================================================
   إضافة مهمة
========================================================= */

function addTask(){
    const input = $("taskInput");
    const dateInput = $("dateInput");
    const priorityInput = $("priorityInput");

    const title = input.value.trim();
    if(!title){
        toast("اكتب اسم المهمة أولاً", "warn");
        input.focus();
        return;
    }

    tasks.push({
        id: Date.now(),
        title,
        date: dateInput.value,
        priority: priorityInput.value,
        completed: false
    });

    saveTasks();
    input.value = "";
    dateInput.value = "";
    priorityInput.value = "medium";
    input.focus();

    renderTasks();
    updateStats();
    toast("تمت إضافة المهمة ✅", "success");
}

/* =========================================================
   الفلترة والترتيب
========================================================= */

function searchTasks(){ renderTasks(); }

function filterTasks(){
    const search = $("searchInput").value.trim();
    const normalizedSearch = normalizeArabic(search);

    let result = tasks.filter((task) => {
        if(!normalizeArabic(task.title).includes(normalizedSearch)) return false;

        switch(currentFilter){
            case "today":     return isToday(task.date);
            case "week":      return isThisWeek(task.date);
            case "remaining": return !task.completed;
            case "completed": return task.completed;
            case "overdue":   return isOverdue(task);
            case "upcoming":
                return !task.completed && task.date && task.date >= getToday();
            case "nodate":    return !task.date;
            case "high":      return task.priority === "high" && !task.completed;
            default:          return true;
        }
    });

    result.sort((a, b) => {
        if(a.completed !== b.completed) return a.completed ? 1 : -1;

        if(a.date && b.date){
            const byDate = a.date.localeCompare(b.date);
            if(byDate !== 0) return byDate;
            return priorityRank(a) - priorityRank(b);
        }
        if(a.date) return -1;
        if(b.date) return 1;
        return priorityRank(a) - priorityRank(b);
    });

    return result;
}

/* =========================================================
   عرض المهام
========================================================= */

const EMPTY_MSGS = {
    all:       ["📭", "لا توجد مهام مطابقة"],
    today:     ["📅", "لا توجد مهام اليوم"],
    week:      ["📆", "لا توجد مهام هذا الأسبوع"],
    remaining: ["⏳", "لا توجد مهام متبقية"],
    completed: ["✅", "لا توجد مهام مكتملة"],
    overdue:   ["🔴", "لا توجد مهام متأخرة"],
    upcoming:  ["⏳", "لا توجد مهام قادمة"],
    nodate:    ["📌", "لا توجد مهام بدون موعد"],
    high:      ["⚡", "لا توجد مهام عالية الأهمية"]
};

function renderTasks(){
    const list = $("taskList");
    const filtered = filterTasks();

    if(filtered.length === 0){
        const [icon, msg] = EMPTY_MSGS[currentFilter] || EMPTY_MSGS.all;
        list.innerHTML =
            '<div class="empty"><span class="big">'+icon+'</span>'+msg+'</div>';
        return;
    }

    const frag = document.createDocumentFragment();

    filtered.forEach((task) => {
        const el = document.createElement("div");
        el.className = "task" +
            (task.completed ? " completed" : "") +
            (isOverdue(task) ? " overdue" : "");

        let dateText = "بدون موعد";
        if(task.date){
            const d = new Date(task.date + "T00:00:00");
            dateText = d.toLocaleDateString("ar-EG", {
                year:"numeric", month:"long", day:"numeric"
            });
        }

        let priorityText = "🟠 متوسطة";
        let priorityClass = "medium";
        if(task.priority === "high"){ priorityText = "🔴 عالية"; priorityClass = "high"; }
        if(task.priority === "low"){ priorityText = "🟢 منخفضة"; priorityClass = "low"; }

        el.innerHTML =
            '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
            '<div class="task-info">' +
                '<span class="badge date-badge">📅 ' + dateText + '</span>' +
                '<span class="badge ' + priorityClass + '">' + priorityText + '</span>' +
                '<span class="badge status">' + getStatus(task) + '</span>' +
            '</div>' +
            '<div class="task-actions">' +
                '<button class="complete-btn" data-action="toggle" data-id="' + task.id + '">' +
                    (task.completed ? '↩️ إلغاء الإكمال' : '✅ إكمال') + '</button>' +
                '<button class="edit-btn" data-action="edit" data-id="' + task.id + '">✏️ تعديل</button>' +
                '<button class="delete-btn" data-action="delete" data-id="' + task.id + '">🗑️ حذف</button>' +
            '</div>';

        frag.appendChild(el);
    });

    list.innerHTML = "";
    list.appendChild(frag);
}

/* =========================================================
   الإحصائيات
========================================================= */

function updateStats(){
    const total = tasks.length;
    const done = tasks.filter(t => t.completed).length;
    const overdue = tasks.filter(isOverdue).length;
    const today = getToday();

    $("totalCount").textContent = total;
    $("completedCount").textContent = done;
    $("remainingCount").textContent = total - done;
    $("overdueCount").textContent = overdue;

    $("todayCount").textContent = tasks.filter(t => isToday(t.date)).length;
    $("weekCount").textContent = tasks.filter(t => isThisWeek(t.date)).length;
    $("upcomingCount").textContent =
        tasks.filter(t => !t.completed && t.date && t.date >= today).length;
    $("dashboardOverdue").textContent = overdue;

    const pct = total ? Math.round(done / total * 100) : 0;
    $("progressText").textContent = pct + "%";
    $("progressBar").style.width = pct + "%";
}

function refreshAll(){
    renderTasks();
    updateStats();
}

/* =========================================================
   الفلاتر
========================================================= */

function setFilter(name){
    currentFilter = name;
    document.querySelectorAll(".filter-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.filter === name);
    });
    renderTasks();
}

/* =========================================================
   إكمال / حذف / تعديل
========================================================= */

function toggleTask(id){
    const task = tasks.find(t => t.id === id);
    if(!task) return;
    task.completed = !task.completed;
    saveTasks();
    if(task.completed && cleanupFinishedWeek(task)){
        refreshAll();
        return;
    }
    refreshAll();
    toast(task.completed ? "أحسنت! تم إكمال المهمة 🎉" : "تمت إعادة المهمة", "success");
}

function deleteTask(id){
    const idx = tasks.findIndex(t => t.id === id);
    if(idx < 0) return;
    const removed = tasks.splice(idx, 1)[0];
    saveTasks();
    refreshAll();
    toast("تم حذف المهمة", "warn", {
        actionLabel: "تراجع",
        onAction: () => {
            tasks.splice(Math.min(idx, tasks.length), 0, removed);
            saveTasks();
            refreshAll();
        }
    });
}

async function deleteAllTasks(){
    if(!tasks.length){
        toast("لا توجد مهام لحذفها", "warn");
        return;
    }
    const ok = await confirmDialog({
        title: "حذف كل المهام",
        body: "سيتم حذف جميع المهام (" + tasks.length + "). يمكنك التراجع بعد الحذف مباشرة.",
        yesLabel: "حذف الكل"
    });
    if(!ok) return;
    const backup = tasks;
    tasks = [];
    saveTasks();
    refreshAll();
    toast("تم حذف كل المهام", "warn", {
        actionLabel: "تراجع",
        onAction: () => {
            tasks = backup;
            saveTasks();
            refreshAll();
        }
    });
}

function openEdit(id){
    const task = tasks.find(t => t.id === id);
    if(!task) return;
    editingId = id;
    $("editTitle").value = task.title;
    $("editDate").value = task.date;
    $("editPriority").value = task.priority;
    $("editModal").classList.add("show");
    $("editTitle").focus();
}

function closeModal(){
    $("editModal").classList.remove("show");
    editingId = null;
}

function saveEdit(){
    const task = tasks.find(t => t.id === editingId);
    if(!task){ closeModal(); return; }
    const title = $("editTitle").value.trim();
    if(!title){
        toast("اسم المهمة لا يمكن أن يكون فارغاً", "warn");
        $("editTitle").focus();
        return;
    }
    task.title = title;
    task.date = $("editDate").value;
    task.priority = $("editPriority").value;
    saveTasks();
    closeModal();
    refreshAll();
    toast("تم حفظ التعديل", "success");
}

/* =========================================================
   نسخة احتياطية
========================================================= */

function exportTasks(){
    const blob = new Blob([JSON.stringify(tasks, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "مهامي-" + getToday() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("تم حفظ النسخة الاحتياطية", "success");
}

$("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
        try{
            const parsed = JSON.parse(reader.result);
            if(!Array.isArray(parsed)) throw new Error("bad");
            const data = sanitizeTasks(parsed);
            const ok = await confirmDialog({
                title: "استرجاع نسخة",
                body: "سيتم استبدال المهام الحالية (" + tasks.length + ") بـ " + data.length + " مهمة من النسخة. متابعة؟",
                yesLabel: "استرجاع"
            });
            if(!ok) return;
            tasks = data;
            saveTasks();
            refreshAll();
            toast("تم استرجاع المهام", "success");
        }catch(err){
            toast("الملف غير صالح", "error");
        }
    };
    reader.readAsText(file);
    e.target.value = "";
});

/* =========================================================
   الوضع الليلي
========================================================= */

function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
}

$("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});

/* =========================================================
   الأحداث
========================================================= */

$("taskList").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const id = Number(btn.dataset.id);
    const action = btn.dataset.action;
    if(action === "toggle") toggleTask(id);
    else if(action === "edit") openEdit(id);
    else if(action === "delete") deleteTask(id);
});

$("taskInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); addTask(); }
});

$("editModal").addEventListener("click", (e) => {
    if(e.target === $("editModal")) closeModal();
});

document.addEventListener("keydown", (e) => {
    if(e.key !== "Escape") return;
    if(confirmCallback) confirmCallback(false);
    else if($("editModal").classList.contains("show")) closeModal();
});

document.querySelectorAll(".dashboard-card").forEach((card) => {
    card.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); card.click(); }
    });
});

if(channel){
    channel.onmessage = (e) => {
        if(e.data && e.data.type === "update"){
            tasks = sanitizeTasks(e.data.tasks);
            refreshAll();
        }
    };
}

document.addEventListener("visibilitychange", () => {
    if(!document.hidden) refreshAll();
});

/* =========================================================
   التشغيل
========================================================= */

(function init(){
    let theme = "light";
    try{
        theme = localStorage.getItem(THEME_KEY) ||
            (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }catch(e){}
    applyTheme(theme);

    tasks = loadTasks();
    [...tasks].forEach((t) => { if(tasks.includes(t)) cleanupFinishedWeek(t); });
    refreshAll();
})();
</script>
