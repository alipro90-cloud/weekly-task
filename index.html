<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مهامي الأسبوعية</title>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--text:#16203a;--muted:#6b7794;--border:#e3e8f0;
  --primary:#4f6ef7;--success:#22b573;--warning:#f5a623;--danger:#e5484d;
  --shadow:0 2px 12px rgba(20,40,80,.07);--chip:#eef1f8;
}
[data-theme="dark"]{
  --bg:#0d121c;--card:#161d2c;--text:#e8eefb;--muted:#8a95ad;--border:#252e44;
  --primary:#6c85ff;--chip:#1f2840;--shadow:0 2px 12px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-size:28px}
h1{font-size:20px;margin:0}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.95)}
.icon-btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-status{font-size:12px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--muted);box-shadow:var(--shadow)}
.sync-status.ok{color:var(--success)}
.sync-status.err{color:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync-status.ok .dot{background:var(--success)}
.sync-status.err .dot{background:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat .v{display:block;font-size:20px;font-weight:700}
.stat .l{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:56px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr}}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.99)}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;border-right:4px solid var(--primary)}
.task.done{opacity:.6;border-right-color:var(--success)}
.task.overdue{border-right-color:var(--danger)}
.task.high{border-right-color:var(--danger)}
.task.medium{border-right-color:var(--warning)}
.task.low{border-right-color:var(--success)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;flex-shrink:0;margin-top:2px;position:relative}
.check.on{background:var(--success);border-color:var(--success)}
.check.on::after{content:'✓';color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.task-main{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;margin:0 0 4px;word-break:break-word}
.task.done .task-title{text-decoration:line-through}
.task-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:6px;background:var(--chip);font-size:10px}
.tag.high{background:rgba(229,72,77,.15);color:var(--danger)}
.tag.medium{background:rgba(245,166,35,.18);color:var(--warning)}
.tag.low{background:rgba(34,181,115,.15);color:var(--success)}
.task-notes{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.del{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
.del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;transition:transform .3s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="brand">
      <span class="logo">📋</span>
      <div>
        <h1>مهامي الأسبوعية</h1>
        <p class="sub" id="weekRange">—</p>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button id="themeBtn" class="icon-btn" title="تبديل الوضع">🌙</button>
      <button id="syncBtn" class="icon-btn" title="مزامنة">🔄</button>
    </div>
  </header>

  <div class="sync-status" id="syncStatus">
    <span class="dot"></span><span id="syncText">جارٍ التحميل…</span>
  </div>

  <section class="stats">
    <div class="stat"><span class="v" id="stToday">0</span><span class="l">مهام اليوم</span></div>
    <div class="stat"><span class="v" id="stWeek">0</span><span class="l">هذا الأسبوع</span></div>
    <div class="stat"><span class="v" id="stUpcoming">0</span><span class="l">قادمة</span></div>
    <div class="stat"><span class="v" id="stOverdue">0</span><span class="l">متأخرة</span></div>
    <div class="stat"><span class="v" id="stRate">0%</span><span class="l">نسبة الإنجاز</span></div>
  </section>

  <section class="card">
    <h2>➕ إضافة مهمة</h2>
    <form id="taskForm">
      <input id="fTitle" placeholder="عنوان المهمة…" required maxlength="120">
      <div class="row">
        <input id="fDate" type="date" required>
        <select id="fPriority">
          <option value="عالية">عالية</option>
          <option value="متوسطة" selected>متوسطة</option>
          <option value="منخفضة">منخفضة</option>
        </select>
      </div>
      <div class="row">
        <select id="fCat">
          <option value="عمل">عمل</option>
          <option value="شخصي">شخصي</option>
          <option value="دراسة">دراسة</option>
          <option value="أخرى">أخرى</option>
        </select>
        <select id="fStatus">
          <option value="قيد التنفيذ" selected>قيد التنفيذ</option>
          <option value="منجزة">منجزة</option>
        </select>
      </div>
      <textarea id="fNotes" placeholder="ملاحظات (اختياري)…" maxlength="400"></textarea>
      <button type="submit" class="btn">إضافة المهمة</button>
    </form>
  </section>

  <section class="card">
    <div class="filters">
      <button class="chip active" data-filter="all">الكل</button>
      <button class="chip" data-filter="pending">متبقية</button>
      <button class="chip" data-filter="done">منجزة</button>
      <button class="chip" data-filter="overdue">متأخرة</button>
    </div>
    <div id="taskList" class="tasks"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   ⚙️⚙️⚙️  عدّل السطرين التاليين فقط  ⚙️⚙️⚙️
   ══════════════════════════════════════════════════════════
   1) API_URL:https://script.google.com/macros/s/AKfycbwGNtGqybQ5xfLoPO5yslO-3dh0ODhLLURl9mnB8FF8qa97Tugq06ECfB4UPfyRQHNnSg/exec
     
   2) SECRET: ali mosa
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwGNtGyBQ5xFLOo5ys1o-3dhO0DHLUR19mMB8Ff8qp9O7TugGo0ECFB4UPyfQRI',
  SECRET:  'ali mosa'
};
};
/* ══════════════════════════════════════════════════════════ */

const AR_DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const STORE_KEY = 'tasks_weekly_v1';

const state = {
  tasks: [],
  filter: 'all',
  syncing: false,
  online: false
};

/* ---------- أدوات ---------- */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now() * 1000 + Math.floor(Math.random()*1000);

function dayName(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return AR_DAYS[d.getDay()] || '';
}
function weekBounds() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay());
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  end.setHours(23,59,59,999);
  return { start, end };
}
function inThisWeek(iso) {
  if (!iso) return false;
  const d = new Date(iso + 'T00:00:00');
  const { start, end } = weekBounds();
  return d >= start && d <= end;
}
function isOverdue(t) {
  return t.status !== 'منجزة' && t.date && t.date < todayISO();
}
function isDone(t){ return t.status === 'منجزة'; }

function toast(msg, ms=2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), ms);
}

/* ---------- التخزين المحلي ---------- */
function loadLocal() {
  try { state.tasks = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { state.tasks = []; }
}
function saveLocal() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state.tasks));
}

/* ---------- الاتصال بالخادم ---------- */
function apiReady() {
  return CONFIG.API_URL
    && CONFIG.API_URL.startsWith('http')
    && !CONFIG.API_URL.includes('ضع-')
    && CONFIG.SECRET
    && !CONFIG.SECRET.includes('ضع-');
}

async function apiCall(payload) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    body: JSON.stringify({ key: CONFIG.SECRET, ...payload }),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  });
  return await res.json();
}

function setSync(text, cls='') {
  $('#syncText').textContent = text;
  const el = $('#syncStatus');
  el.className = 'sync-status ' + cls;
}

/* ---------- المزامنة ---------- */
async function pullCloud(silent=false) {
  if (!apiReady()) {
    setSync('غير مربوط — البيانات محفوظة على هذا الجهاز فقط.', '');
    state.online = false;
    return false;
  }
  if (!silent) $('#syncBtn').classList.add('spin');
  try {
    const r = await apiCall({ action: 'pull' });
    if (!r.ok) throw new Error(r.error || 'فشل');
    const deleted = new Set((r.deleted || []).map(Number));
    state.tasks = (r.tasks || [])
      .filter(t => !deleted.has(Number(t.id)))
      .map(t => ({ ...t, day: t.day || dayName(t.date) }));
    saveLocal();
    state.online = true;
    setSync('متزامن مع Google Sheets ✓', 'ok');
    return true;
  } catch (e) {
    state.online = false;
    setSync('تعذّر الاتصال — البيانات محفوظة محلياً.', 'err');
    if (!silent) toast('فشل الاتصال بالخادم');
    return false;
  } finally {
    $('#syncBtn').classList.remove('spin');
  }
}

async function pushTask(task) {
  if (!apiReady()) return;
  try {
    await apiCall({ action: 'saveTask', task });
    state.online = true;
    setSync('متزامن مع Google Sheets ✓', 'ok');
  } catch {
    state.online = false;
    setSync('تعذّر الرفع — سيُحفظ محلياً فقط.', 'err');
  }
}
async function pushDelete(id) {
  if (!apiReady()) return;
  try {
    await apiCall({ action: 'deleteTask', id });
  } catch {}
}

/* ---------- العرض ---------- */
function renderStats() {
  const today = todayISO();
  const week = state.tasks.filter(t => inThisWeek(t.date));
  const tdy  = state.tasks.filter(t => t.date === today && !isDone(t));
  const upc  = state.tasks.filter(t => t.date > today && !isDone(t));
  const ovd  = state.tasks.filter(isOverdue);
  const done = state.tasks.filter(isDone).length;
  const rate = state.tasks.length ? Math.round(done / state.tasks.length * 100) : 0;

  $('#stToday').textContent   = tdy.length;
  $('#stWeek').textContent    = week.length;
  $('#stUpcoming').textContent= upc.length;
  $('#stOverdue').textContent = ovd.length;
  $('#stRate').textContent    = rate + '%';

  const { start, end } = weekBounds();
  const fmt = d => d.toLocaleDateString('ar-EG',{day:'2-digit',month:'short'});
  $('#weekRange').textContent = `أسبوع ${fmt(start)} → ${fmt(end)}`;
}

function renderTasks() {
  const list = $('#taskList');
  let arr = [...state.tasks];

  if (state.filter === 'done')     arr = arr.filter(isDone);
  else if (state.filter === 'pending') arr = arr.filter(t => !isDone(t));
  else if (state.filter === 'overdue') arr = arr.filter(isOverdue);

  arr.sort((a,b) => {
    const da = a.date || '9999', db = b.date || '9999';
    if (da !== db) return da.localeCompare(db);
    const p = { 'عالية':0,'متوسطة':1,'منخفضة':2 };
    return (p[a.priority]??3) - (p[b.priority]??3);
  });

  if (!arr.length) {
    list.innerHTML = '<div class="empty">لا توجد مهام هنا 🌿</div>';
    return;
  }

  const prioCls = { 'عالية':'high','متوسطة':'medium','منخفضة':'low' };

  list.innerHTML = arr.map(t => {
    const cls = [
      'task',
      isDone(t) ? 'done' : '',
      isOverdue(t) ? 'overdue' : '',
      prioCls[t.priority] || ''
    ].filter(Boolean).join(' ');
    return `
      <div class="${cls}" data-id="${t.id}">
        <button class="check ${isDone(t)?'on':''}" data-act="toggle" title="تبديل الحالة"></button>
        <div class="task-main">
          <p class="task-title">${esc(t.title)}</p>
          <div class="task-meta">
            <span>📅 ${t.date || '—'} · ${esc(t.day || dayName(t.date))}</span>
            <span class="tag ${prioCls[t.priority]||''}">${esc(t.priority||'')}</span>
            <span class="tag">${esc(t.category||'')}</span>
          </div>
          ${t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : ''}
        </div>
        <button class="del" data-act="del" title="حذف">✕</button>
      </div>`;
  }).join('');
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){ renderStats(); renderTasks(); }

/* ---------- الأحداث ---------- */
$('#taskForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('#fTitle').value.trim();
  const date  = $('#fDate').value;
  if (!title || !date) return;

  const task = {
    id: uid(),
    title,
    date,
    day: dayName(date),
    category: $('#fCat').value,
    priority: $('#fPriority').value,
    status: $('#fStatus').value,
    notes: $('#fNotes').value.trim()
  };

  state.tasks.push(task);
  saveLocal(); renderAll();
  $('#taskForm').reset();
  $('#fDate').value = todayISO();
  toast('تمت إضافة المهمة ✓');
  pushTask(task);
});

$('#taskList').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = Number(btn.closest('.task').dataset.id);
  const t = state.tasks.find(x => Number(x.id) === id);
  if (!t) return;

  if (btn.dataset.act === 'toggle') {
    t.status = isDone(t) ? 'قيد التنفيذ' : 'منجزة';
    saveLocal(); renderAll();
    pushTask(t);
  } else if (btn.dataset.act === 'del') {
    if (!confirm('حذف هذه المهمة؟')) return;
    state.tasks = state.tasks.filter(x => Number(x.id) !== id);
    saveLocal(); renderAll();
    toast('تم الحذف');
    pushDelete(id);
  }
});

$$('.chip').forEach(c => c.addEventListener('click', () => {
  $$('.chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  state.filter = c.dataset.filter;
  renderTasks();
}));

$('#syncBtn').addEventListener('click', async () => {
  if (state.syncing) return;
  state.syncing = true;
  await pullCloud();
  renderAll();
  state.syncing = false;
});

/* الوضع الليلي/النهاري */
const THEME_KEY = 'tasks_theme';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem(THEME_KEY, t);
}
$('#themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});

/* ---------- التشغيل ---------- */
(async function init() {
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');
  loadLocal();
  $('#fDate').value = todayISO();
  renderAll();

  if (apiReady()) {
    setSync('جارٍ الاتصال بالخادم…');
    await pullCloud(true);
    renderAll();
  } else {
    setSync('غير مربوط — البيانات محفوظة على هذا الجهاز فقط.');
  }
})();
</script>
</body>
</html>
